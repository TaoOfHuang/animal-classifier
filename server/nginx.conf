# ── 反向代理（明文 HTTP :80）──────────────────────────────────────────
#
# 当前形态：nginx 监听 80，把 /api/ 与 /health 反代到本机 3000 的 Express。
# 配套的客户端设置：
#   - src/services/apiConfig.ts → PROD_API_BASE_URL = 'http://62.234.190.216'（不写端口即 80）
#   - android/app/build.gradle → release 的 usesCleartextTraffic = true
#     （不放开的话，release 包会在 okhttp 层被系统拦掉，只报 Network request failed）
#
# ⚠️ 这是**过渡方案**：全程明文，设备令牌（Bearer Token）会以明文过链路，
#    不能上架。正式发版前必须按文件末尾「升级到 HTTPS」改造。
#
# ⚠️ 三个实测踩过的坑：
#   ① 后端（Node/PM2）不要自己占 80/443。Express 直接监听 443 时只会说明文
#      HTTP，TLS 握手会被当成畸形请求回 `HTTP/1.1 400 Bad Request`，而且
#      Token 全程裸奔。后端请只监听本机：server/.env 里 `PORT=3000`。
#   ② 服务器上 80 默认被 nginx 自带站点占用（/health 与 /api/* 全部 404）。
#      所以这里用 `default_server` 接管，并且要删掉 `/etc/nginx/sites-enabled/default`，
#      否则改了配置也不生效。若报 `duplicate default server` 就是没删干净。
#   ③ 换 IP / 换域名时，改这里的 server_name 与客户端的 PROD_API_BASE_URL 两处即可。

server {
    # 接管 80 上所有请求（含按 IP 直连），压过 nginx 自带默认站点
    listen 80 default_server;
    listen [::]:80 default_server;

    # 裸 IP 方案：靠 default_server 接管即可，不需要真实域名
    server_name _;

    # 识别接口提交的是 base64 图片，默认 1M 会直接 413
    client_max_body_size 10M;

    # ── API 反向代理 ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 传递客户端真实信息（设备注册节流按 IP 计数，这两个头别丢）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 识别要绕到上游 AI，可能偏慢；默认 60s 容易在正常请求上被截断
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── 健康检查 ────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── 日志 ────────────────────────────────────────────────────────
    access_log /var/log/nginx/animal-api-access.log;
    error_log  /var/log/nginx/animal-api-error.log;
}

# ── 升级到 HTTPS（正式发版前做）────────────────────────────────────────
#
# 前置条件：域名已完成 ICP 备案（大陆机房）+ DNS 解析到本机。
# 裸 IP 走不通——Let's Encrypt 不为 IP 签发证书；自签证书在 Android 7+ 的正式包
# 里默认不被信任（项目也没有配 network_security_config），握手必然失败。
#
# 改造步骤：
#   1. 签发证书：certbot --nginx -d api.example.com
#   2. 把上面这个 server 块的 80 改为「只做跳转 + 保留 ACME 校验通道」：
#        location /.well-known/acme-challenge/ { root /var/www/certbot; }
#        location / { return 301 https://$host$request_uri; }
#   3. 新增一个 server 块做真正的对外入口，location 部分照搬上面：
#        listen 443 ssl;
#        http2 on;                                  # nginx ≥ 1.25.1 用这行
#        server_name api.example.com;
#        ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
#        ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
#        ssl_protocols TLSv1.2 TLSv1.3;
#   4. 客户端两处改回再重新打包（否则 release 仍会走明文）：
#        build.gradle    → usesCleartextTraffic = false
#        apiConfig.ts    → PROD_API_BASE_URL = 'https://api.example.com'
