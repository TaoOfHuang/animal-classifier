services:
  api:
    build: .
    container_name: animal-classifier-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      # 容器内路径（WORKDIR=/app），覆盖 .env 里的相对路径 ./data/app.sqlite
      - DB_PATH=/app/data/app.sqlite
    # SQLite 数据必须持久化，否则重建容器后设备与当日用量全部丢失。
    # 这里用 named volume 而不是 bind mount：Docker 会继承镜像中 /app/data 的属主，
    # 非 root 的 appuser 才有写权限；bind mount 会沿用宿主目录属主，容易权限不足。
    volumes:
      - animal-data:/app/data
    # If you need to override specific env vars here:
    # environment:
    #   ADMIN_TOKEN: "your-admin-token"
    #   AI_BASE_URL: "http://192.168.5.8:1234"
    networks:
      - animal-network

networks:
  animal-network:
    driver: bridge

volumes:
  animal-data:
